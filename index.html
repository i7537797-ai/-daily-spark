<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spark — Задачи и Календарь</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <!-- Боковое меню -->
  <aside class="w-full md:w-80 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-6 custom-scroll overflow-y-auto">
    <div class="flex items-center gap-3">
      <div class="bg-amber-400 text-slate-950 p-2 rounded-xl text-xl font-bold flex items-center justify-center w-10 h-10 shadow-lg shadow-amber-400/20">
        ⚡
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Daily Spark</h1>
        <p class="text-xs text-slate-400">Планировщик & Календарь</p>
      </div>
    </div>

    <!-- Фильтры -->
    <div class="flex flex-col gap-1">
      <div class="text-xs font-semibold text-slate-500 uppercase px-3 mb-1">Вид</div>
      <button onclick="setFilter('all')" id="btn-filter-all" class="flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium bg-slate-800 text-white transition">
        <span class="flex items-center gap-3"><i class="fa-solid fa-list-check w-4 text-slate-400"></i> Все задачи</span>
        <span id="count-all" class="text-xs bg-slate-700/60 px-2 py-0.5 rounded-full text-slate-300">0</span>
      </button>
      <button onclick="setFilter('today')" id="btn-filter-today" class="flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition">
        <span class="flex items-center gap-3"><i class="fa-regular fa-calendar-day w-4 text-emerald-400"></i> Сегодня</span>
        <span id="count-today" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0</span>
      </button>
      <button onclick="setFilter('nodate')" id="btn-filter-nodate" class="flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition">
        <span class="flex items-center gap-3"><i class="fa-regular fa-clock w-4 text-amber-400"></i> Без срока</span>
        <span id="count-nodate" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0</span>
      </button>
      <button onclick="setFilter('recurring')" id="btn-filter-recurring" class="flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition">
        <span class="flex items-center gap-3"><i class="fa-solid fa-arrows-rotate w-4 text-indigo-400"></i> Повторяющиеся</span>
        <span id="count-recurring" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0</span>
      </button>
    </div>

    <!-- Проекты и Календари -->
    <div class="flex flex-col gap-1">
      <div class="text-xs font-semibold text-slate-500 uppercase px-3 mb-1">Проекты / Календари</div>
      <div id="calendars-list" class="flex flex-col gap-1"></div>
    </div>

    <!-- Авторизация Google -->
    <div class="mt-auto pt-4 border-t border-slate-800">
      <div id="auth-logged-out" class="flex flex-col gap-2">
        <button id="auth-btn" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-sm shadow transition">
          <i class="fa-brands fa-google text-red-500"></i> Войти через Google
        </button>
      </div>

      <div id="auth-logged-in" class="hidden flex-col gap-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-cyan-600 text-white font-bold flex items-center justify-center text-sm shadow">
            Г
          </div>
          <div class="overflow-hidden">
            <div class="text-sm font-semibold text-white truncate">Аккаунт подключен</div>
            <div class="text-xs text-emerald-400 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Google Calendar
            </div>
          </div>
        </div>
        <button id="signout-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 px-3 rounded-xl text-xs transition border border-slate-700/60">
          Выйти
        </button>
      </div>
    </div>
  </aside>

  <!-- Основная рабочая область -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-950">
    <header class="p-5 md:px-8 border-b border-slate-800 flex items-center justify-between">
      <div>
        <h2 id="view-title" class="text-xl md:text-2xl font-bold text-white">Все задачи</h2>
        <p id="view-desc" class="text-xs text-slate-400">Полный список ваших задач и планов</p>
      </div>
    </header>

    <!-- Поле быстрого добавления -->
    <div class="p-5 md:px-8 pb-3">
      <form id="new-task-form" class="bg-slate-900 border border-slate-800 focus-within:border-cyan-500/50 rounded-2xl p-3 flex flex-col md:flex-row gap-3 transition">
        <input type="text" id="task-input" placeholder="Что нужно сделать?" required
               class="bg-transparent flex-1 text-sm text-white px-2 py-1 outline-none placeholder-slate-500">
        <div class="flex items-center gap-2">
          <input type="date" id="task-date" class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700/70 outline-none">
          <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition ml-auto">
            <i class="fa-solid fa-plus"></i> Добавить
          </button>
        </div>
      </form>
    </div>

    <!-- Список задач -->
    <div id="tasks-container" class="flex-1 overflow-y-auto px-5 md:px-8 py-3 custom-scroll flex flex-col gap-2.5">
      <!-- Задачи рендерятся через JS -->
    </div>
  </main>

  <!-- Google API SDK -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <script>
    const CLIENT_ID = '33202353069-b5s8l03c15o1flg67i604s428q79t81p.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyA4Q_O5h...'; // Укажи свой актуальный API Key, если он не сохранён в файле
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
    const SCOPES = 'https://www.googleapis.com/auth/calendar';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    let state = {
      filter: 'all',
      calendars: [],
      tasks: JSON.parse(localStorage.getItem('daily_spark_tasks') || '[]')
    };

    function saveTasks() {
      localStorage.setItem('daily_spark_tasks', JSON.stringify(state.tasks));
      render();
    }

    function setFilter(name) {
      state.filter = name;
      ['all', 'today', 'nodate', 'recurring'].forEach(f => {
        const btn = document.getElementById(`btn-filter-${f}`);
        if (btn) {
          if (f === name) {
            btn.className = "flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium bg-slate-800 text-cyan-400 transition";
          } else {
            btn.className = "flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-white transition";
          }
        }
      });
      render();
    }

    function render() {
      const todayStr = new Date().toISOString().split('T')[0];
      
      const countAll = state.tasks.length;
      const countToday = state.tasks.filter(t => t.date === todayStr).length;
      const countNodate = state.tasks.filter(t => !t.date).length;
      const countRecurring = state.tasks.filter(t => t.repeat === 'recurring').length;

      document.getElementById('count-all').innerText = countAll;
      document.getElementById('count-today').innerText = countToday;
      document.getElementById('count-nodate').innerText = countNodate;
      document.getElementById('count-recurring').innerText = countRecurring;

      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      const filtered = state.tasks.filter(t => {
        if (state.filter === 'today') return t.date === todayStr;
        if (state.filter === 'nodate') return !t.date;
        if (state.filter === 'recurring') return t.repeat === 'recurring';
        if (state.filter.startsWith('cal_')) return t.projectId === state.filter.replace('cal_', '');
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-slate-500 text-sm">
            <i class="fa-regular fa-calendar-check text-3xl mb-2 opacity-40"></i>
            Нет задач в этом списке
          </div>`;
        return;
      }

      filtered.forEach(task => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 hover:border-slate-700/80 rounded-xl p-3 flex items-center justify-between gap-3 transition";
        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <span class="text-sm font-medium text-slate-200 truncate ${task.completed ? 'line-through text-slate-500' : ''}">${task.title}</span>
            ${task.repeat === 'recurring' ? '<span class="text-xs bg-indigo-950 text-indigo-400 border border-indigo-800 px-2 py-0.5 rounded-full flex items-center gap-1">🔁 Повтор</span>' : ''}
            ${task.date ? `<span class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-regular fa-calendar text-[10px]"></i> ${task.date}</span>` : ''}
          </div>
          <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-red-400 p-1 transition">
            <i class="fa-regular fa-trash-can text-sm"></i>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveTasks();
    }

    document.getElementById('new-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const date = document.getElementById('task-date').value;
      if (!input.value.trim()) return;

      state.tasks.push({
        id: 'task_' + Date.now(),
        title: input.value.trim(),
        date: date || '',
        repeat: 'none',
        completed: false
      });
      input.value = '';
      document.getElementById('task-date').value = '';
      saveTasks();
    });

    // Google Calendar API
    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: [DISCOVERY_DOC],
        });
        gapiInited = true;
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) throw resp;
          document.getElementById('auth-logged-out').classList.add('hidden');
          document.getElementById('auth-logged-in').classList.remove('hidden');
          await loadGoogleCalendars();
        }
      });
      gisInited = true;
    }

    async function loadGoogleCalendars() {
      try {
        const res = await gapi.client.calendar.calendarList.list();
        const items = res.result.items || [];
        state.calendars = items;

        const calList = document.getElementById('calendars-list');
        calList.innerHTML = '';
        items.forEach(cal => {
          const btn = document.createElement('button');
          btn.className = "flex items-center justify-between px-3 py-1.5 rounded-xl text-xs text-slate-400 hover:bg-slate-800 transition truncate";
          btn.innerHTML = `<span class="truncate flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:${cal.backgroundColor || '#06b6d4'}"></span> ${cal.summary}</span>`;
          btn.onclick = () => {
            state.filter = 'cal_' + cal.id;
            render();
          };
          calList.appendChild(btn);
        });

        // Загрузка событий без дублирования (singleEvents: false)
        for (const cal of items) {
          const eventsRes = await gapi.client.calendar.events.list({
            calendarId: cal.id,
            singleEvents: false
          });
          const evts = eventsRes.result.items || [];
          evts.forEach(ev => {
            if (!state.tasks.find(t => t.id === ev.id)) {
              const isRecurring = Boolean(ev.recurrence && ev.recurrence.length > 0);
              state.tasks.push({
                id: ev.id,
                projectId: cal.id,
                title: ev.summary || 'Без названия',
                date: ev.start ? (ev.start.dateTime ? ev.start.dateTime.split('T')[0] : (ev.start.date || '')) : '',
                repeat: isRecurring ? 'recurring' : 'none',
                completed: false,
                isGoogle: true
              });
            }
          });
        }
        saveTasks();
      } catch (e) {
        console.error("Ошибка загрузки календаря:", e);
      }
    }

    document.getElementById('auth-btn').onclick = () => {
      if (tokenClient) tokenClient.requestAccessToken();
    };

    document.getElementById('signout-btn').onclick = () => {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
      }
      localStorage.removeItem('daily_spark_tasks');
      state.tasks = [];
      document.getElementById('auth-logged-in').classList.add('hidden');
      document.getElementById('auth-logged-out').classList.remove('hidden');
      document.getElementById('calendars-list').innerHTML = '';
      render();
    };

    window.onload = () => {
      gapiLoaded();
      gisLoaded();
      render();
    };
  </script>
</body>
</html>
