<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spark</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #161f30;
      --surface-hover: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #06b6d4;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    aside {
      width: 280px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .filter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .filter-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    .project-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.5rem;
    }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.5rem;
      border-radius: 8px;
    }

    .avatar-wrapper {
      position: relative;
      cursor: pointer;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #041014;
    }

    .user-info {
      flex: 1;
      overflow: hidden;
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      overflow-y: auto;
    }

    header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .voice-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
    }

    .mic-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn.active {
      color: var(--danger);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    .btn {
      background-color: var(--accent);
      color: #041014;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .btn:hover { opacity: 0.9; }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .google-btn {
      background: #ffffff;
      color: #3c4043;
      border: 1px solid #dadce0;
      font-weight: 500;
    }

    .google-btn:hover { background: #f8fafd; }

    .task-form {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .task-input, .task-select {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      color: var(--text);
      font-size: 0.9rem;
    }

    .task-input { flex: 1 1 240px; }
    .task-input:focus, .task-select:focus { outline: 1px solid var(--accent); }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: background 0.15s ease;
    }

    .task-card:hover {
      background-color: var(--surface-hover);
    }

    .task-card.urgent { border-left: 4px solid var(--danger); }
    .task-card.completed { opacity: 0.45; }
    .task-card.completed .task-text { text-decoration: line-through; }

    .task-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }

    .task-checkbox {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .meta-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
    }

    .delete-btn:hover { color: var(--danger); }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 3rem;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand">⚡ Daily Spark</div>

    <div>
      <div class="section-title">Вид</div>
      <ul class="filter-list">
        <li><button class="filter-btn active" onclick="setFilter('all')"><span>Все задачи</span><span id="c-all">0</span></button></li>
        <li><button class="filter-btn" onclick="setFilter('today')"><span>Сегодня</span><span id="c-today">0</span></button></li>
        <li><button class="filter-btn" onclick="setFilter('no-date')"><span>Без срока</span><span id="c-nodate">0</span></button></li>
        <li><button class="filter-btn" onclick="setFilter('recurring')"><span>Повторяющиеся</span><span id="c-repeat">0</span></button></li>
      </ul>
    </div>

    <div>
      <div class="section-title">Проекты / Календари</div>
      <ul class="filter-list" id="projects-list"></ul>
      <button class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;" onclick="createLocalProject()">+ Добавить проект</button>
    </div>

    <div class="sidebar-bottom">
      <div class="profile-card">
        <div class="avatar-wrapper" onclick="triggerAvatarUpload()" title="Нажмите, чтобы сменить фото">
          <div id="avatar-container">
            <div class="user-avatar" id="avatar-placeholder">U</div>
          </div>
          <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="handleCustomAvatar(event)">
        </div>
        <div class="user-info">
          <div class="user-name" id="user-display-name">Гость</div>
          <div class="user-status" id="user-sync-status">
            <span class="status-dot" id="status-dot" style="background: var(--muted);"></span>
            <span id="status-text">Офлайн-режим</span>
          </div>
        </div>
      </div>
      <button id="auth-btn" class="btn google-btn" onclick="handleAuthClick()">
        <svg width="14" height="14" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
        Войти через Google
      </button>
      <button id="signout-btn" class="btn btn-secondary" style="display: none;" onclick="handleSignoutClick()">Выйти</button>
    </div>
  </aside>

  <main>
    <header>
      <h1 id="view-title">Все задачи</h1>
      <div class="header-actions">
        <div class="voice-control">
          <button id="mic-btn" class="mic-btn" title="Нажмите для голосового ввода">🎙️</button>
          <span id="voice-status" style="font-size: 0.85rem; color: var(--muted);">Голос</span>
        </div>
      </div>
    </header>

    <form class="task-form" onsubmit="handleAddTask(event)">
      <div class="form-row">
        <input type="text" id="task-title" class="task-input" placeholder="Что нужно сделать?" required autocomplete="off">
        <select id="task-project" class="task-select">
          <option value="">Без проекта (По умолчанию)</option>
        </select>
      </div>

      <div class="form-row">
        <input type="date" id="task-date" class="task-input" style="flex: 0 0 160px;">
        <input type="time" id="task-time" class="task-input" style="flex: 0 0 120px;">
        
        <select id="task-repeat" class="task-select">
          <option value="none">Не повторять</option>
          <option value="daily">Каждый день</option>
          <option value="weekly">Каждую неделю</option>
          <option value="monthly">Каждый месяц</option>
          <option value="yearly">Каждый год</option>
        </select>

        <label class="checkbox-label">
          <input type="checkbox" id="task-urgent">
          🔥 Срочно
        </label>

        <button type="submit" class="btn" style="margin-left: auto;">Добавить</button>
      </div>
    </form>

    <div class="tasks-list" id="tasks-container"></div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script>
    const CLIENT_ID = '113453139171-s49a76tbe66vnr83li0qmi3gq5khh2i0.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyDeBzSQ68co2rZOMVpFA4HgMQ1TidKtMG4';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.profile';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    let state = {
      projects: JSON.parse(localStorage.getItem('spark_projects')) || [
        { id: 'p_study', title: 'Учёба', color: '#6366f1' },
        { id: 'p_market', title: 'Маркетинг', color: '#f59e0b' }
      ],
      tasks: JSON.parse(localStorage.getItem('spark_tasks')) || [],
      user: JSON.parse(localStorage.getItem('spark_user')) || { name: 'Гость', photo: null, customPhoto: null },
      currentFilter: 'all',
      isGoogleAuth: false
    };

    function saveState() {
      localStorage.setItem('spark_tasks', JSON.stringify(state.tasks));
      localStorage.setItem('spark_projects', JSON.stringify(state.projects));
      localStorage.setItem('spark_user', JSON.stringify(state.user));
      render();
    }

    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: [
            'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest',
            'https://www.googleapis.com/discovery/v1/apis/oauth2/v2/rest'
          ],
        });
        gapiInited = true;
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '',
      });
      gisInited = true;
    }

    function handleAuthClick() {
      if (!tokenClient) return;
      tokenClient.callback = async (resp) => {
        if (resp.error) throw resp;
        state.isGoogleAuth = true;
        document.getElementById('auth-btn').style.display = 'none';
        document.getElementById('signout-btn').style.display = 'block';
        document.getElementById('status-dot').style.background = '#10b981';
        document.getElementById('status-text').textContent = 'Google Calendar';

        await loadUserProfile();
        await loadGoogleCalendars();
      };
      tokenClient.requestAccessToken({ prompt: '' });
    }

    function handleSignoutClick() {
      const token = gapi.client.getToken();
      if (token) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
      }
      state.isGoogleAuth = false;
      state.user = { name: 'Гость', photo: null, customPhoto: null };
      document.getElementById('auth-btn').style.display = 'flex';
      document.getElementById('signout-btn').style.display = 'none';
      document.getElementById('status-dot').style.background = 'var(--muted)';
      document.getElementById('status-text').textContent = 'Офлайн-режим';
      saveState();
    }

    async function loadUserProfile() {
      try {
        const res = await gapi.client.oauth2.userinfo.get();
        state.user.name = res.result.name || 'Пользователь';
        state.user.photo = res.result.picture || null;
        saveState();
      } catch (e) {
        console.error('Ошибка профиля', e);
      }
    }

    async function loadGoogleCalendars() {
      try {
        const calList = await gapi.client.calendar.calendarList.list();
        const items = calList.result.items || [];
        
        items.forEach(cal => {
          if (!state.projects.find(p => p.id === cal.id)) {
            state.projects.push({
              id: cal.id,
              title: cal.summary + (cal.primary ? ' (Личный)' : ''),
              color: cal.backgroundColor || '#06b6d4',
              isGoogle: true
            });
          }
        });

        for (const cal of items) {
          const eventsRes = await gapi.client.calendar.events.list({
            calendarId: cal.id,
            timeMin: new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString(),
            singleEvents: true
          });
          const evts = eventsRes.result.items || [];
          evts.forEach(ev => {
            if (!state.tasks.find(t => t.id === ev.id)) {
              state.tasks.push({
                id: ev.id,
                projectId: cal.id,
                title: ev.summary || 'Без названия',
                date: ev.start.dateTime ? ev.start.dateTime.split('T')[0] : (ev.start.date || ''),
                time: ev.start.dateTime ? ev.start.dateTime.split('T')[1].substring(0, 5) : '',
                repeat: ev.recurrence ? 'recurring' : 'none',
                isUrgent: (ev.summary || '').includes('🔥'),
                completed: false,
                isGoogle: true
              });
            }
          });
        }
        saveState();
      } catch (e) {
        console.error('Ошибка синхронизации календарей', e);
      }
    }

    function createLocalProject() {
      const title = prompt('Название нового проекта:');
      if (!title || !title.trim()) return;
      const colors = ['#6366f1', '#f59e0b', '#ec4899', '#10b981', '#06b6d4', '#8b5cf6'];
      state.projects.push({
        id: 'proj_' + Date.now(),
        title: title.trim(),
        color: colors[Math.floor(Math.random() * colors.length)],
        isGoogle: false
      });
      saveState();
    }

    async function handleAddTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const projectId = document.getElementById('task-project').value || null;
      const date = document.getElementById('task-date').value || '';
      const time = document.getElementById('task-time').value || '';
      const repeat = document.getElementById('task-repeat').value;
      const isUrgent = document.getElementById('task-urgent').checked;

      const finalTitle = (isUrgent ? '🔥 ' : '') + title;
      const taskId = 'task_' + Date.now();

      const newTask = {
        id: taskId,
        projectId,
        title: finalTitle,
        date,
        time,
        repeat,
        isUrgent,
        completed: false,
        isGoogle: false
      };

      if (state.isGoogleAuth && projectId && date) {
        const selectedProj = state.projects.find(p => p.id === projectId);
        if (selectedProj && selectedProj.isGoogle) {
          let resource = { summary: finalTitle };
          if (time) {
            resource.start = { dateTime: new Date(`${date}T${time}`).toISOString() };
            resource.end = { dateTime: new Date(new Date(`${date}T${time}`).getTime() + 3600000).toISOString() };
          } else {
            resource.start = { date };
            resource.end = { date };
          }
          if (repeat !== 'none') {
            const rules = { daily: 'RRULE:FREQ=DAILY', weekly: 'RRULE:FREQ=WEEKLY', monthly: 'RRULE:FREQ=MONTHLY', yearly: 'RRULE:FREQ=YEARLY' };
            resource.recurrence = [rules[repeat]];
          }
          try {
            const res = await gapi.client.calendar.events.insert({ calendarId: projectId, resource });
            newTask.id = res.result.id;
            newTask.isGoogle = true;
          } catch (err) {
            console.warn('Сохранено локально (ошибка Google):', err);
          }
        }
      }

      state.tasks.unshift(newTask);
      saveState();
      document.getElementById('task-title').value = '';
      document.getElementById('task-urgent').checked = false;
    }

    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;

      if (!task.completed && task.repeat !== 'none' && task.date) {
        const d = new Date(task.date);
        if (task.repeat === 'daily') d.setDate(d.getDate() + 1);
        else if (task.repeat === 'weekly') d.setDate(d.getDate() + 7);
        else if (task.repeat === 'monthly') d.setMonth(d.getMonth() + 1);
        else if (task.repeat === 'yearly') d.setFullYear(d.getFullYear() + 1);
        task.date = d.toISOString().split('T')[0];
      } else {
        task.completed = !task.completed;
      }
      saveState();
    }

    async function deleteTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (task && task.isGoogle && state.isGoogleAuth) {
        try {
          await gapi.client.calendar.events.delete({ calendarId: task.projectId, eventId: task.id });
        } catch (e) {
          console.warn('Удаление из Google отменено');
        }
      }
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
    }

    function setFilter(filter) {
      state.currentFilter = filter;
      render();
    }

    function triggerAvatarUpload() {
      document.getElementById('avatar-input').click();
    }

    function handleCustomAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          state.user.customPhoto = e.target.result;
          saveState();
        };
        reader.readAsDataURL(file);
      }
    }

    function render() {
      document.getElementById('user-display-name').textContent = state.user.name;
      const avatarContainer = document.getElementById('avatar-container');
      const photoSrc = state.user.customPhoto || state.user.photo;
      if (photoSrc) {
        avatarContainer.innerHTML = `<img src="${photoSrc}" class="user-avatar" alt="Avatar">`;
      } else {
        const initial = state.user.name ? state.user.name[0].toUpperCase() : 'U';
        avatarContainer.innerHTML = `<div class="user-avatar">${initial}</div>`;
      }

      const pSelect = document.getElementById('task-project');
      const curSelect = pSelect.value;
      pSelect.innerHTML = '<option value="">Без проекта (По умолчанию)</option>';
      state.projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.title;
        pSelect.appendChild(opt);
      });
      pSelect.value = curSelect;

      const pList = document.getElementById('projects-list');
      pList.innerHTML = '';
      state.projects.forEach(p => {
        const cnt = state.tasks.filter(t => t.projectId === p.id && !t.completed).length;
        const li = document.createElement('li');
        li.innerHTML = `
          <button class="filter-btn ${state.currentFilter === 'p_' + p.id ? 'active' : ''}" onclick="setFilter('p_${p.id}')">
            <span><span class="project-dot" style="background:${p.color}"></span>${p.title}</span>
            <span>${cnt}</span>
          </button>
        `;
        pList.appendChild(li);
      });

      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('c-all').textContent = state.tasks.filter(t => !t.completed).length;
      document.getElementById('c-today').textContent = state.tasks.filter(t => !t.completed && t.date === todayStr).length;
      document.getElementById('c-nodate').textContent = state.tasks.filter(t => !t.completed && !t.date).length;
      document.getElementById('c-repeat').textContent = state.tasks.filter(t => !t.completed && t.repeat !== 'none').length;

      document.querySelectorAll('.filter-list .filter-btn').forEach(b => {
        if (!state.currentFilter.startsWith('p_')) {
          b.classList.toggle('active', (b.getAttribute('onclick') || '').includes(`'${state.currentFilter}'`));
        }
      });

      const viewTitle = document.getElementById('view-title');
      if (state.currentFilter === 'all') viewTitle.textContent = 'Все задачи';
      else if (state.currentFilter === 'today') viewTitle.textContent = 'Сегодня';
      else if (state.currentFilter === 'no-date') viewTitle.textContent = 'Без срока';
      else if (state.currentFilter === 'recurring') viewTitle.textContent = 'Повторяющиеся задачи';
      else if (state.currentFilter.startsWith('p_')) {
        const id = state.currentFilter.replace('p_', '');
        const p = state.projects.find(x => x.id === id);
        viewTitle.textContent = p ? p.title : 'Проект';
      }

      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      const filtered = state.tasks.filter(t => {
        if (state.currentFilter === 'all') return true;
        if (state.currentFilter === 'today') return t.date === todayStr;
        if (state.currentFilter === 'no-date') return !t.date;
        if (state.currentFilter === 'recurring') return t.repeat !== 'none';
        if (state.currentFilter.startsWith('p_')) return t.projectId === state.currentFilter.replace('p_', '');
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="empty-state">В этом разделе пока нет задач</div>';
        return;
      }

      filtered.forEach(task => {
        const project = state.projects.find(p => p.id === task.projectId);
        const card = document.createElement('div');
        card.className = `task-card ${task.isUrgent ? 'urgent' : ''} ${task.completed ? 'completed' : ''}`;

        let repeatText = '';
        if (task.repeat === 'daily') repeatText = '🔁 Ежедневно';
        else if (task.repeat === 'weekly') repeatText = '🔁 Еженедельно';
        else if (task.repeat === 'monthly') repeatText = '🔁 Ежемесячно';
        else if (task.repeat === 'yearly') repeatText = '🔁 Ежегодно';

        card.innerHTML = `
          <div class="task-left">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
            <span class="task-text">${task.title}</span>
          </div>
          <div class="task-meta">
            ${task.date ? `<span class="meta-badge">📅 ${task.date}${task.time ? ' ' + task.time : ''}</span>` : '<span class="meta-badge">Без даты</span>'}
            ${repeatText ? `<span class="meta-badge">${repeatText}</span>` : ''}
            ${project ? `<span class="meta-badge" style="background:${project.color}22; color:${project.color}">${project.title}</span>` : ''}
            <button class="delete-btn" onclick="deleteTask('${task.id}')">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('mic-btn');
    const voiceStatus = document.getElementById('voice-status');

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';

      micBtn.onclick = () => {
        if (micBtn.classList.contains('active')) recognition.stop();
        else recognition.start();
      };

      recognition.onstart = () => {
        micBtn.classList.add('active');
        voiceStatus.textContent = 'Слушаю...';
      };

      recognition.onend = () => {
        micBtn.classList.remove('active');
        voiceStatus.textContent = 'Голос';
      };

      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        voiceStatus.textContent = `«${text}»`;
        parseVoiceCommand(text);
      };
    } else {
      micBtn.disabled = true;
      voiceStatus.textContent = 'Не поддерживается';
    }

    function parseVoiceCommand(text) {
      let clean = text.toLowerCase();
      if (clean.startsWith('добавь') || clean.startsWith('создай')) {
        clean = clean.replace(/^(добавь|создай)\s*/i, '');
        let targetDate = '';
        let repeat = 'none';

        if (clean.includes('на завтра')) {
          const d = new Date();
          d.setDate(d.getDate() + 1);
          targetDate = d.toISOString().split('T')[0];
          clean = clean.replace('на завтра', '');
        } else if (clean.includes('на сегодня')) {
          targetDate = new Date().toISOString().split('T')[0];
          clean = clean.replace('на сегодня', '');
        }

        if (clean.includes('каждый день') || clean.includes('ежедневно')) {
          repeat = 'daily';
          clean = clean.replace(/(каждый день|ежедневно)/g, '');
        } else if (clean.includes('каждый месяц') || clean.includes('ежемесячно')) {
          repeat = 'monthly';
          clean = clean.replace(/(каждый месяц|ежемесячно)/g, '');
        }

        state.tasks.unshift({
          id: 'task_' + Date.now(),
          projectId: null,
          title: clean.trim(),
          date: targetDate,
          time: '',
          repeat,
          isUrgent: false,
          completed: false,
          isGoogle: false
        });
        saveState();
      } else if (clean.startsWith('удали')) {
        const query = clean.replace(/^удали\s*/i, '').trim();
        state.tasks = state.tasks.filter(t => !t.title.toLowerCase().includes(query));
        saveState();
      }
    }

    window.addEventListener('load', () => {
      gapiLoaded();
      gisLoaded();
      render();
    });
  </script>
</body>
</html>
